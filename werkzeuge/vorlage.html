<title>enneo Wettbewerb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: eine ruhige Spalte, Glasflächen über weichem enneo-Licht */
:root {
  --bg: #F4F2F7; --text: #17182A; --text-2: #5B5C6D; --text-3: #8E8E9C;
  --lila: #7B5AE2; --lila-d: #5A37D6; --lila-weich: #ECE6FC;
  --glas: rgba(255,255,255,.58); --glas-rand: rgba(255,255,255,.9); --glas-licht: rgba(255,255,255,.6); --glas-schatten: rgba(60,40,140,.35);
  --linie: rgba(23,24,42,.08); --hover: rgba(255,255,255,.7); --feld: rgba(23,24,42,.045); --aktiv: #FFFFFF;
  --haupt-bg: #17182A; --haupt-hover: #2C2E45; --haupt-fg: #FFFFFF;
  --warn-fg: #B4561E; --warn-bg: #FBEBDD; --neutral-bg: rgba(23,24,42,.06);
  --s-voll: #7B5AE2; --s-hell: #CBBDF6; --s-grau: rgba(23,24,42,.13); --s-wett: #17182A;
  --licht-1: #BCA9F5; --licht-2: #D2E1F8; --licht-3: #E2D8FB; --licht-op: .7; --panel: rgba(250,249,253,.92);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1020; --text: #ECEAF5; --text-2: #A6A5B8; --text-3: #75758C;
  --lila: #9479F0; --lila-d: #B9A7FA; --lila-weich: rgba(148,121,240,.18);
  --glas: rgba(255,255,255,.055); --glas-rand: rgba(255,255,255,.12); --glas-licht: rgba(255,255,255,.08); --glas-schatten: rgba(0,0,0,.55);
  --linie: rgba(255,255,255,.09); --hover: rgba(255,255,255,.06); --feld: rgba(255,255,255,.06); --aktiv: rgba(255,255,255,.12);
  --haupt-bg: #ECEAF5; --haupt-hover: #FFFFFF; --haupt-fg: #0F1020;
  --warn-fg: #F2B48A; --warn-bg: rgba(242,140,80,.16); --neutral-bg: rgba(255,255,255,.08);
  --s-voll: #9479F0; --s-hell: rgba(148,121,240,.45); --s-grau: rgba(255,255,255,.14); --s-wett: #ECEAF5;
  --licht-1: #4A33B8; --licht-2: #24275E; --licht-3: #3A2C86; --licht-op: .55; --panel: rgba(22,23,42,.94); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1020; --text: #ECEAF5; --text-2: #A6A5B8; --text-3: #75758C;
  --lila: #9479F0; --lila-d: #B9A7FA; --lila-weich: rgba(148,121,240,.18);
  --glas: rgba(255,255,255,.055); --glas-rand: rgba(255,255,255,.12); --glas-licht: rgba(255,255,255,.08); --glas-schatten: rgba(0,0,0,.55);
  --linie: rgba(255,255,255,.09); --hover: rgba(255,255,255,.06); --feld: rgba(255,255,255,.06); --aktiv: rgba(255,255,255,.12);
  --haupt-bg: #ECEAF5; --haupt-hover: #FFFFFF; --haupt-fg: #0F1020;
  --warn-fg: #F2B48A; --warn-bg: rgba(242,140,80,.16); --neutral-bg: rgba(255,255,255,.08);
  --s-voll: #9479F0; --s-hell: rgba(148,121,240,.45); --s-grau: rgba(255,255,255,.14); --s-wett: #ECEAF5;
  --licht-1: #4A33B8; --licht-2: #24275E; --licht-3: #3A2C86; --licht-op: .55; --panel: rgba(22,23,42,.94); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body { margin: 0; color: var(--text); font: 400 15px/1.55 "Geist", system-ui, sans-serif;
  font-feature-settings: "ss01", "tnum"; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

.licht { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.licht i { position: absolute; border-radius: 50%; filter: blur(100px); opacity: var(--licht-op); }
.licht i:nth-child(1) { width: 55vw; height: 50vw; left: -18vw; top: -22vw; background: var(--licht-1); }
.licht i:nth-child(2) { width: 42vw; height: 38vw; right: -14vw; top: 18vh; background: var(--licht-2); }
.licht i:nth-child(3) { width: 50vw; height: 30vw; left: 25vw; bottom: -20vw; background: var(--licht-3); }

.glas { background: var(--glas); border: 1px solid var(--glas-rand);
  -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%);
  box-shadow: 0 1px 0 var(--glas-licht) inset, 0 30px 60px -40px var(--glas-schatten); }

.seite { position: relative; max-width: 1168px; margin: 0 auto; padding-block: 0 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

/* Leiste: Logo links, Suche rechts. Mehr nicht. */
.leiste { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 5; display: flex; align-items: center; gap: 16px;
  height: 52px; margin-top: 12px; padding: 0 8px 0 18px; border-radius: 16px; }
.leiste img { height: 17px; display: block; }
.leiste svg.logo { height: 18px; width: auto; display: block; color: var(--text); }
.suche { margin-left: auto; display: flex; align-items: center; gap: 8px; width: 260px; height: 36px; padding: 0 12px;
  border-radius: 10px; background: var(--feld); color: var(--text-3); transition: background .15s; }
.suche:focus-within { background: var(--aktiv); box-shadow: 0 0 0 1px var(--lila-weich); }
.suche input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text); }
.suche input::placeholder { color: var(--text-3); }
.suche kbd { font: 500 11px "Geist", sans-serif; color: var(--text-3); border: 1px solid var(--linie); border-radius: 5px; padding: 1px 5px; }

.eng { max-width: 880px; margin: 0 auto; }
.fragen { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 10px; border: 0; cursor: pointer;
  background: var(--haupt-bg); color: var(--haupt-fg); font-size: 14px; font-weight: 500; white-space: nowrap; }
.fragen:hover { background: var(--haupt-hover); }
.neu-knopf { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border: 0; border-radius: 10px; background: var(--feld); color: var(--text-2); cursor: pointer; transition: background .15s, color .15s; }
.neu-knopf:hover, .neu-knopf[aria-expanded="true"] { background: var(--aktiv); color: var(--text); }
.neu-feld { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 72px); right: max(16px, calc((100vw - 928px) / 2 + 24px), env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 32px)); border-radius: 16px; padding: 14px; }
.neu-feld form { display: flex; gap: 8px; }
.neu-feld input { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--linie); background: var(--feld); color: var(--text); border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; outline: none; }
.neu-feld input:focus { border-color: var(--lila); }
.neu-feld button { height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--haupt-bg); color: var(--haupt-fg); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.neu-feld button:disabled { opacity: .6; cursor: default; }
.neu-meldung { margin: 10px 2px 0; font-size: 13px; color: var(--text-2); }
.neu-meldung a { color: var(--lila-d); }
.tz.anfrage { box-shadow: 0 -1px 0 var(--linie); color: var(--text-3); }
.tz.anfrage .name { color: var(--text-2); }
.tz.anfrage .status { grid-column: 2 / -1; display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.tz.anfrage .status button { margin-left: auto; border: 0; background: none; color: var(--text-3); cursor: pointer; padding: 4px; border-radius: 6px; }
.tz.anfrage .status button:hover { color: var(--text); background: var(--feld); }
.laeuft { width: 7px; height: 7px; border-radius: 50%; background: var(--lila); flex: none; animation: puls 1.6s ease-in-out infinite; }
.wartet { width: 7px; height: 7px; border-radius: 50%; background: var(--s-hell); flex: none; }
.fehlt { width: 7px; height: 7px; border-radius: 50%; background: var(--warn-fg); flex: none; }
@keyframes puls { 50% { opacity: .3; } }

/* Übersicht */
.kopf { padding: 56px 0 24px; display: flex; align-items: baseline; justify-content: space-between; gap: 20px; }
.kopf h1 { margin: 0; font-size: clamp(44px, 7vw, 72px); font-weight: 600; letter-spacing: -0.055em; line-height: 1; }

.filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
.filter button { border: 1px solid var(--linie); background: var(--glas); color: var(--text-2); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.filter button:hover { color: var(--text); }
.filter button[aria-pressed="true"] { background: var(--haupt-bg); border-color: var(--haupt-bg); color: var(--haupt-fg); }
.filter button span { opacity: .6; margin-left: 5px; }
.filter .trenner { width: 1px; height: 20px; background: var(--linie); margin: 0 6px; }

.tabelle { border-radius: 20px; padding: 6px; }
.tz { display: grid; grid-template-columns: minmax(0, 2.3fr) 128px minmax(0, 1.25fr) minmax(0, 1.35fr) minmax(0, 1.05fr) 168px; gap: 20px; align-items: center; padding: 15px 18px; border-radius: 13px; }
.tkopf { padding-block: 10px 8px; }
.tkopf button { border: 0; background: none; padding: 0; text-align: left; font-size: 12.5px; font-weight: 500; color: var(--text-3); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.tkopf button:hover, .tkopf button[aria-sort] { color: var(--text); }
a.tz { transition: background .15s; box-shadow: 0 -1px 0 var(--linie); }
a.tz:hover { background: var(--hover); box-shadow: none; }
a.tz:hover + a.tz { box-shadow: none; }
.tz .name { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; display: flex; align-items: center; gap: 12px; min-width: 0; }
.tz .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marke-logo { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 9px; background: #FFFFFF; box-shadow: 0 0 0 1px var(--linie), 0 1px 2px rgba(23,24,42,.06); overflow: hidden; }
.marke-logo img { width: 24px; height: 24px; object-fit: contain; display: block; }
.marke-logo b { font-size: 15px; font-weight: 600; color: #17182A; }
.dkopf .marke-logo { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 20px; }
.dkopf .marke-logo img { width: 38px; height: 38px; }
.tz .zelle { font-size: 13.5px; line-height: 1.4; color: var(--text-2); min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tz .zahl { margin-top: 7px; font-size: 12.5px; color: var(--text-3); }
.tz .zahl b { font-weight: 600; color: var(--text); }
.tz .zahl b.e { color: var(--lila-d); }
.chip { display: inline-block; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 7px; background: var(--neutral-bg); color: var(--text-2); white-space: nowrap; }
.leer { padding: 28px 22px; color: var(--text-3); }

/* Einordnung: ein Block je verglichenem Thema */
.balken { display: flex; gap: 3px; }
.balken i { flex: 1; height: 5px; border-radius: 2px; background: var(--s-grau); }
.balken .p-voll { background: var(--s-voll); }
.balken .p-hell { background: var(--s-hell); }
.balken .p-rand, .balken .p-dunkel { background: var(--s-wett); }
.balken .p-rand { opacity: .45; }
.stand-zahl { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12.5px; color: var(--text-3); }
.stand-zahl b { font-weight: 600; }
.stand-zahl .e { color: var(--lila-d); }
.stand-zahl .w { color: var(--text); }

/* Detail */
.zurueck { display: inline-flex; align-items: center; gap: 6px; margin-top: 44px; color: var(--text-3); font-size: 14px; }
.zurueck:hover { color: var(--text); }
.dkopf { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 22px 0 26px; }
.dkopf h1 { margin: 0 0 10px; font-size: clamp(48px, 8vw, 80px); font-weight: 600; letter-spacing: -0.06em; line-height: .95; }
.dkopf p { margin: 0; color: var(--text-2); font-size: 17px; max-width: 520px; text-wrap: pretty; }
.dkopf .info { margin-top: 14px; font-size: 13px; color: var(--text-3); }
.dkopf .info a:hover { color: var(--lila-d); }
.aktionen { display: flex; gap: 8px; }
.knopf { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 10px;
  font-size: 14px; font-weight: 500; background: var(--glas); border: 1px solid var(--glas-rand); transition: background .15s; }
.knopf:hover { background: var(--aktiv); }
.knopf.haupt { background: var(--haupt-bg); border-color: var(--haupt-bg); color: var(--haupt-fg); }
.knopf.haupt:hover { background: var(--haupt-hover); }
.knopf { cursor: pointer; }
.knopf:disabled { opacity: .6; cursor: default; }
.hinweis { font-size: 13px; color: var(--text-3); margin-top: 8px; text-align: right; }
:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }

.reiter { display: flex; gap: 2px; padding: 4px; border-radius: 12px; width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
.reiter button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.reiter button:hover { color: var(--text); }
.reiter button[aria-selected="true"] { background: var(--aktiv); color: var(--text); box-shadow: 0 1px 3px rgba(23,24,42,.08); }

.blatt { border-radius: 20px; padding: 36px 40px 40px; }
.blatt h2 { margin: 36px 0 12px; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.blatt h2:first-child { margin-top: 0; }
.blatt p { margin: 0 0 12px; color: var(--text-2); max-width: 68ch; text-wrap: pretty; }
.blatt ul { list-style: none; margin: 0; padding: 0; }
.blatt li { color: var(--text-2); padding: 12px 0; border-top: 1px solid var(--linie); max-width: 72ch; text-wrap: pretty; }
.blatt li:first-child { border-top: 0; padding-top: 2px; }
.blatt strong { color: var(--text); font-weight: 600; }
.blatt li strong:first-child { display: block; margin-bottom: 2px; }
.blatt a { color: var(--lila-d); }

.fazit { font-size: 19px; line-height: 1.55; color: var(--text) !important; letter-spacing: -0.01em; margin-bottom: 28px !important; }

.tw { overflow-x: auto; }
.blatt table { width: 100%; border-collapse: collapse; font-size: 14px; }
.blatt th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--text-3); padding: 0 14px 10px 0; border-bottom: 1px solid var(--linie); }
.blatt td { padding: 13px 14px 13px 0; border-bottom: 1px solid var(--linie); color: var(--text-2); vertical-align: top; }
.blatt tr:last-child td { border-bottom: 0; }
.blatt td:first-child { color: var(--text); }
.blatt td strong { font-weight: 500; }
.eck thead { display: none; }
.eck td:first-child { color: var(--text-3); width: 120px; }
.eck td:nth-child(2) { color: var(--text); font-weight: 500; white-space: nowrap; }
.eck td:nth-child(2) strong { font-weight: 500; }

.pill { display: inline-block; white-space: nowrap; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 7px; }
.pill.p-voll { background: var(--s-voll); color: #FFFFFF; }
.pill.p-hell { background: var(--lila-weich); color: var(--lila-d); }
.pill.p-grau, .pill.p-offen { background: var(--neutral-bg); color: var(--text-2); }
.pill.p-rand { background: var(--neutral-bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--linie); }
.pill.p-dunkel { background: var(--haupt-bg); color: var(--haupt-fg); }

.quellen { display: flex; flex-wrap: wrap; gap: 8px; }
.quellen a { padding: 6px 11px; border-radius: 9px; background: var(--feld); color: var(--text-2); font-size: 13.5px; }
.quellen a:hover { background: var(--aktiv); color: var(--lila-d); }

/* Co-Pilot */
.copilot { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px)); width: min(420px, calc(100vw - 24px)); border-radius: 20px;
  display: flex; flex-direction: column; overflow: hidden; background: var(--panel); }
.cp-kopf { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--linie); }
.cp-kopf b { font-size: 15px; font-weight: 600; }
.cp-zu { margin-left: auto; border: 0; background: var(--feld); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--text-2); display: grid; place-items: center; }
.cp-verlauf { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.cp-leer { color: var(--text-2); font-size: 14px; }
.cp-leer p { margin: 0 0 12px; }
.cp-vorschlaege { display: flex; flex-direction: column; gap: 6px; }
.cp-vorschlaege button { text-align: left; border: 1px solid var(--linie); background: var(--glas); color: var(--text); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; cursor: pointer; }
.cp-vorschlaege button:hover { border-color: var(--lila); }
.cp-msg { font-size: 14px; line-height: 1.55; max-width: 100%; overflow-wrap: anywhere; }
.cp-msg.ich { align-self: flex-end; background: var(--haupt-bg); color: var(--haupt-fg); padding: 9px 13px; border-radius: 14px 14px 4px 14px; max-width: 85%; }
.cp-msg.ki { color: var(--text-2); }
.cp-msg.ki p { margin: 0 0 8px; }
.cp-msg.ki ul { margin: 0 0 8px; padding-left: 18px; }
.cp-msg.ki li { margin-bottom: 4px; }
.cp-msg.ki strong { color: var(--text); font-weight: 600; }
.cp-msg.denkt { color: var(--text-3); }
.cp-fehler { font-size: 13px; color: var(--warn-fg); }
.cp-eingabe { display: flex; gap: 8px; align-items: flex-end; padding: 12px; border-top: 1px solid var(--linie); }
.cp-eingabe textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--linie); background: var(--feld); color: var(--text); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; max-height: 140px; outline: none; }
.cp-eingabe textarea:focus { border-color: var(--lila); }
.cp-senden { border: 0; height: 40px; padding: 0 14px; border-radius: 11px; background: var(--haupt-bg); color: var(--haupt-fg); font-weight: 500; cursor: pointer; }
.cp-senden:disabled { opacity: .5; cursor: default; }

@media (max-width: 980px) and (min-width: 721px) {
  .tz { grid-template-columns: minmax(0, 2fr) 120px minmax(0, 1.2fr) 150px; }
  .tz > :nth-child(4), .tz > :nth-child(5) { display: none; }
}
@media (max-width: 720px) {
  .seite { padding-block: 0 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .suche { width: auto; flex: 1; }
  .suche kbd { display: none; }
  .kopf { padding-top: 56px; }
  .tz { grid-template-columns: minmax(0, 1fr) 140px; gap: 6px 14px; padding: 14px 12px; }
  .tz > :nth-child(3), .tz > :nth-child(4), .tz > :nth-child(5) { display: none; }
  .tz > :nth-child(2) { grid-row: 2; }
  .tz.anfrage .status { grid-column: 1 / -1; grid-row: 2; }
  .tz > :nth-child(6) { grid-row: 1 / span 2; grid-column: 2; }
  .tkopf { display: none; }
  .fragen span { display: none; }
  .dkopf { grid-template-columns: 1fr; }
  .blatt { padding: 24px 20px 28px; }
  .reiter { width: 100%; }
  .reiter button { flex: 1; padding: 7px 4px; font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="licht" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="seite">
  <header class="leiste glas">
    <a href="#">/*LOGO*/</a>
    <label class="suche">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3.5 3.5"/></svg>
      <input id="suche" type="search" placeholder="Suchen" aria-label="Anbieter oder Thema suchen">
      <kbd>/</kbd>
    </label>
    <button class="neu-knopf" id="neu-knopf" hidden aria-expanded="false" aria-controls="neu-feld" title="Anbieter hinzufügen" aria-label="Anbieter hinzufügen"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3v10M3 8h10"/></svg></button>
    <button class="fragen" id="fragen" hidden><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg><span>Fragen</span></button>
  </header>
  <main id="app"></main>
</div>
<div class="neu-feld glas" id="neu-feld" hidden>
  <form id="neu-form" autocomplete="off">
    <input id="neu-url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="Website des Anbieters" aria-label="Website des Anbieters" required>

    <button class="cp-zu" id="cp-zu" aria-label="Schließen"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
  <div class="cp-verlauf" id="cp-verlauf"></div>

    <textarea id="cp-text" rows="1" placeholder="Frage zum Wettbewerb"></textarea>
    <button class="cp-senden" id="cp-senden" type="submit">Senden</button>
  </form>
</aside>

<script>
const STATISCH = /*DATEN*/[];
let KARTEN = STATISCH.slice();
// PDFs liegen neben der Seite und werden über den Download-Dialog des Viewers gespeichert
let speichern = null;
const bereit = window.claude && window.claude.use ? window.claude.use("downloads").then(d => { speichern = d; route(); }).catch(() => {}) : null;
async function pdfSpeichern(b) {
  const name = b.dataset.pdf, text = b.innerHTML;
  b.disabled = true;
  try {
    const r = await fetch("pdf/" + name);
    if (!r.ok) throw new Error("fehlt");
    await speichern.save({ filename: name, data: await r.blob() });
  } catch (e) {
    if (e && e.code && e.code !== "declined") b.insertAdjacentHTML("afterend", `<div class="hinweis">Download gerade nicht möglich.</div>`);
  } finally { b.disabled = false; b.innerHTML = text; }
}
let suche = "", db = null, anfragen = [];
const app = document.getElementById("app");
const feld = document.getElementById("suche");
const datum = iso => { const [j, m, t] = iso.split("-"); return `${t}.${m}.${j}`; };
const markeLogo = k => `<span class="marke-logo">${k.logo ? `<img src="${k.logo}" alt="">` : `<b>${esc(k.name[0])}</b>`}</span>`;
const alt = iso => (Date.now() - new Date(iso)) / 864e5 > 14;
const zurueckPfeil = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8H3m4-4L3 8l4 4"/></svg>`;
const runter = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2.5v8m-3.5-3.5L8 10.5 11.5 7M3 13.5h10"/></svg>`;

const einordnung = k => `
  <div class="balken" title="Ein Block je verglichenem Thema">${k.folge.map(c => `<i class="${c}"></i>`).join("")}</div>
  <div class="stand-zahl"><span class="e"><b>${k.vorn}</b> enneo</span><span class="w"><b>${k.hinten}</b> ${k.name}</span></div>`;

const FOKUS = ["Voicebot", "KI-Agenten", "E-Mail-KI", "Contact Center", "Helpdesk", "CRM & ERP"];
let fokus = "Alle", nurNah = false, sortierung = { feld: "name", ab: false };
const pfeilSort = ab => `<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="${ab ? "M5 8 1.5 3h7z" : "M5 2l3.5 5h-7z"}"/></svg>`;
const anteil = k => k.vorn / Math.max(1, k.vorn + k.hinten);
const SORT = {
  name: (a, b) => a.name.localeCompare(b.name, "de"),
  fokus: (a, b) => FOKUS.indexOf(a.fokus) - FOKUS.indexOf(b.fokus) || a.name.localeCompare(b.name, "de"),
  firma: (a, b) => a.firma.localeCompare(b.firma, "de"),
  hosting: (a, b) => a.hosting.localeCompare(b.hosting, "de"),
  preis: (a, b) => (a.preis === "nicht öffentlich") - (b.preis === "nicht öffentlich") || a.preis.localeCompare(b.preis, "de"),
  einordnung: (a, b) => anteil(b) - anteil(a),
};
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function uebersicht() {
  const q = suche.toLowerCase();
  const passt = k => (fokus === "Alle" || k.fokus === fokus) && (!nurNah || k.naehe === "hoch") &&
    (!q || (k.name + " " + k.kurz + " " + k.firma + " " + k.hosting + " " + k.preis + " " + k.html.replace(/<[^>]+>/g, " ")).toLowerCase().includes(q));
  const treffer = KARTEN.filter(passt).sort(SORT[sortierung.feld]);
  if (sortierung.ab) treffer.reverse();
  const zahl = f => KARTEN.filter(k => (f === "Alle" || k.fokus === f) && (!nurNah || k.naehe === "hoch")).length;
  const spalte = (feld, text) => `<button data-sort="${feld}" ${sortierung.feld === feld ? `aria-sort="${sortierung.ab ? "descending" : "ascending"}"` : ""}>${text}${sortierung.feld === feld ? pfeilSort(sortierung.ab) : ""}</button>`;
  app.innerHTML = `
    <section class="kopf"><h1>Wettbewerb</h1></section>
    <div class="filter" role="group" aria-label="Filter">
      ${["Alle", ...FOKUS].map(f => `<button data-fokus="${f}" aria-pressed="${f === fokus}">${f}<span>${zahl(f)}</span></button>`).join("")}
      <span class="trenner"></span>
      <button data-nah aria-pressed="${nurNah}">Nur nah an enneo</button>
    </div>
    <div class="tabelle glas">
      <div class="tz tkopf">${spalte("name", "Anbieter")}${spalte("fokus", "Schwerpunkt")}${spalte("firma", "Sitz")}${spalte("hosting", "Hosting")}${spalte("preis", "Preise")}${spalte("einordnung", "Einordnung")}</div>
      ${anfrageZeilen()}
      ${treffer.map(k => `
      <a class="tz" href="#${k.slug}">
        <div class="name">${markeLogo(k)}<span>${k.name}</span></div>
        <div><span class="chip">${k.fokus}</span></div>
        <div class="zelle" title="${esc(k.firma)}">${k.firma}</div>
        <div class="zelle" title="${esc(k.hosting)}">${k.hosting}</div>
        <div class="zelle" title="${esc(k.preis)}">${k.preis}</div>
        <div title="${k.vorn} Themen enneo vorn, ${k.hinten} Themen ${esc(k.name)} vorn"><div class="balken">${k.folge.map(c => `<i class="${c}"></i>`).join("")}</div><div class="zahl"><b class="e">${k.vorn}</b> enneo vorn · <b>${k.hinten}</b> dort</div></div>
      </a>`).join("") || `<div class="leer">Keine Treffer${suche ? ` für „${esc(suche)}“` : ""}.</div>`}
    </div>`;
  app.querySelectorAll("[data-fokus]").forEach(b => b.onclick = () => { fokus = b.dataset.fokus; uebersicht(); });
  app.querySelector("[data-nah]").onclick = () => { nurNah = !nurNah; uebersicht(); };
  app.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    const f = b.dataset.sort;
    sortierung = { feld: f, ab: sortierung.feld === f ? !sortierung.ab : false };
    uebersicht();
  });
}

// Abschnitte der Karte auf Reiter verteilen
function abschnitte(k) {
  const teile = k.html.replace(/<li><strong>([^<]+?):<\/strong>/g, "<li><strong>$1</strong>").split(/(?=<h2>)/).map(t => {
    const m = t.match(/^<h2>([^<]+)<\/h2>/);
    return { titel: m ? m[1] : "", inhalt: m ? t.slice(m[0].length) : t };
  });
  const finde = test => teile.filter(t => test(t.titel));
  const nimm = arr => arr.map(t => `<h2>${t.titel}</h2>${t.inhalt}`).join("");
  const fazit = finde(t => t === "Fazit")[0];
  const vorweg = finde(t => t === "Das Wichtigste vorweg")[0];
  const eck = finde(t => t === "Eckdaten")[0];
  const vergleich = finde(t => t === "Unterschiede auf einen Blick")[0];
  const quellen = finde(t => t === "Quellen")[0];
  const fest = ["Fazit", "Das Wichtigste vorweg", "Eckdaten", "Unterschiede auf einen Blick", "Quellen"];
  const argumente = finde(t => t && !fest.includes(t));
  const ueberblick =
    (fazit ? `<p class="fazit">${fazit.inhalt.replace(/<\/?p>/g, "").trim()}</p>` : "") +
    (vorweg ? `<h2>Einordnung</h2>${vorweg.inhalt}` : "") +
    (eck ? `<h2>Eckdaten</h2><div class="eck">${eck.inhalt}</div>` : "");
  return [
    ["Überblick", ueberblick],
    ["Argumente", nimm(argumente)],
    ["Vergleich", vergleich ? vergleich.inhalt : ""],
    ["Quellen", quellen ? `<div class="quellen">${[...quellen.inhalt.matchAll(/<a [^>]*href="([^"]+)"[^>]*>([^<]+)<\/a>/g)].map(m => `<a href="${m[1]}" target="_blank" rel="noopener">${m[2]}</a>`).join("")}</div>` : ""],
  ].filter(([, h]) => h.trim()).map(([t, h]) => [t, h.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, "</table></div>")]);
}

function detail(k, reiter = 0) {
  const tabs = abschnitte(k);
  app.innerHTML = `
    <div class="eng"><a class="zurueck" href="#">${zurueckPfeil} Alle Anbieter</a>
    <section class="dkopf">
      <div>
        ${markeLogo(k)}
        <h1>${k.name}</h1>
        <p>${k.kurz}</p>
        <div class="info"><a href="${k.website}" target="_blank" rel="noopener">${k.website.replace(/^https?:\/\/(www\.)?/, "")}</a></div>
      </div>
      <div class="aktionen">
        ${k.pdf_partner ? `<button class="knopf" data-pdf="${k.pdf_partner}">${runter} Für Partner</button>` : ""}
        ${k.pdf_intern ? `<button class="knopf haupt" data-pdf="${k.pdf_intern}">${runter} PDF</button>` : ""}
      </div>
    </section>
    <div class="reiter glas" role="tablist">${tabs.map(([t], i) => `<button role="tab" aria-selected="${i === reiter}" data-i="${i}">${t}</button>`).join("")}</div>
    <article class="blatt glas" role="tabpanel">${tabs[reiter][1]}</article></div>`;
  app.querySelectorAll(".reiter button").forEach(b => b.onclick = () => detail(k, +b.dataset.i));
  app.querySelectorAll("[data-pdf]").forEach(b => {
    if (!speichern) { b.hidden = true; return; }
    b.onclick = () => pdfSpeichern(b);
  });
}

feld.oninput = e => { suche = e.target.value; if (location.hash) location.hash = ""; else uebersicht(); };
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); feld.focus(); }
  if (e.key === "Escape") { if (!cp("neu-feld").hidden) { neuOeffnen(false); return; } if (!cp("copilot").hidden) { cp("copilot").hidden = true; return; } feld.value = ""; suche = ""; feld.blur(); route(); }
});
function route() {
  const k = KARTEN.find(k => k.slug === location.hash.slice(1));
  k ? detail(k) : uebersicht();
  if (k) window.scrollTo(0, 0);
  cpKontext();
}

// ---------- Co-Pilot: fragt Claude mit dem Inhalt der Seite, die gerade offen ist ----------
let fragen = null, cpLaeuft = null;
const verlaeufe = {};                      // je Kontext (Anbieter oder Übersicht) ein eigenes Gespräch
const cp = id => document.getElementById(id);
const aktuelleKarte = () => KARTEN.find(k => k.slug === location.hash.slice(1));
const textAus = html => html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
const ladeText = async pfad => { try { const r = await fetch(pfad); return r.ok ? await r.text() : ""; } catch (e) { return ""; } };

function kurzfassung(k) {
  const fazit = (k.html.split("<h2>Fazit</h2>")[1] || "").split("<h2>")[0];
  return `${k.name} (${k.fokus}, Nähe zu enneo: ${k.naehe}). ${k.kurz}. Sitz: ${k.firma}. Hosting: ${k.hosting}. Preise: ${k.preis}. Einordnung: ${k.vorn} Themen enneo vorn, ${k.hinten} Themen ${k.name} vorn. Fazit: ${textAus(fazit)}`;
}

function cpKontext() {
  const k = aktuelleKarte();
  cp("cp-kontext").textContent = k ? k.name : "Alle Anbieter";
  cpZeigen();
}

function mdZuHtml(t) {
  const zeilen = esc(t).split("\n");
  let html = "", liste = false;
  for (const z of zeilen) {
    const p = z.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    if (/^\s*[-*•]\s+/.test(z)) { if (!liste) { html += "<ul>"; liste = true; } html += `<li>${p.replace(/^\s*[-*•]\s+/, "")}</li>`; }
    else { if (liste) { html += "</ul>"; liste = false; } if (z.trim()) html += `<p>${p.replace(/^#+\s*/, "")}</p>`; }
  }
  return html + (liste ? "</ul>" : "");
}

function cpZeigen() {
  const k = aktuelleKarte(), key = k ? k.slug : "_alle", v = verlaeufe[key] || [];
  const box = cp("cp-verlauf");
  if (!v.length) {
    const vorschlaege = k
      ? [`Wo gewinnen wir gegen ${k.name}?`, `Welche Einwände hören wir, wenn ein Kunde ${k.name} nutzt?`, `Gib mir einen Pitch in 3 Sätzen gegen ${k.name}.`]
      : ["Wer kann E-Mails bis zur Buchung im ERP automatisieren?", "Welche Anbieter sind bei Energieversorgern stark?", "Gegen wen verlieren wir am ehesten und warum?"];
    box.innerHTML = `<div class="cp-leer"><div class="cp-vorschlaege">${vorschlaege.map(t => `<button type="button">${esc(t)}</button>`).join("")}</div></div>`;
    box.querySelectorAll(".cp-vorschlaege button").forEach(b => b.onclick = () => cpFrage(b.textContent));
  } else {
    box.innerHTML = v.map(m => `<div class="cp-msg ${m.role === "user" ? "ich" : "ki"}">${m.role === "user" ? esc(m.content) : mdZuHtml(m.content)}</div>`).join("");
  }
  box.scrollTop = box.scrollHeight;
}

async function cpFrage(text) {
  text = text.trim();
  if (!text || cpLaeuft || !fragen) return;
  const k = aktuelleKarte(), key = k ? k.slug : "_alle";
  const v = (verlaeufe[key] = verlaeufe[key] || []);
  v.push({ role: "user", content: text });
  cpZeigen();
  const box = cp("cp-verlauf");
  const antwort = document.createElement("div");
  antwort.className = "cp-msg ki denkt"; antwort.textContent = "Denkt nach …";
  box.append(antwort); box.scrollTop = box.scrollHeight;
  cp("cp-senden").textContent = "Stopp";

  // Unterlagen: unsere Fakten + die offene Karte, auf der Übersicht alle Kurzfassungen plus die genannten Anbieter in voller Länge
  const fakten = await ladeText("enneo-fakten.md");
  let unterlagen;
  if (k) unterlagen = `## Karte ${k.name} (die Seite, die der Nutzer gerade offen hat)\n\n${await kartenText(k)}`;
  else {
    const genannt = KARTEN.filter(x => text.toLowerCase().includes(x.name.toLowerCase())).slice(0, 3);
    unterlagen = "## Alle Anbieter in Kurzform\n\n" + KARTEN.map(kurzfassung).join("\n\n");
    for (const x of genannt) unterlagen += `\n\n## Volle Karte ${x.name}\n\n${await kartenText(x)}`;
  }
  const regeln = `Du bist der Wettbewerbs-Co-Pilot im Vertrieb von enneo (KI-Plattform für Kundenservice, Berlin). Nutzer sind enneo-Mitarbeitende im Vertrieb.
Regeln:
- Antworte auf Deutsch, knapp und konkret, meist 3 bis 8 Sätze oder kurze Stichpunkte. Fett ist erlaubt, keine Überschriften, keine Tabellen, keine Gedankenstriche.
- Antworte nur aus den Unterlagen unten. Steht etwas nicht drin, sag das offen und rate nicht. Keine erfundenen Zahlen, Kunden oder Funktionen.
- Über enneo nur, was in den enneo-Fakten steht. Ehrliche Schwächen von enneo nicht verschweigen.
- ${k ? `Der Nutzer ist gerade auf der Seite von ${k.name}. Fragen ohne Namen beziehen sich auf ${k.name}.` : "Der Nutzer ist auf der Übersicht aller Anbieter."}

# enneo-Fakten
${fakten}

# Unterlagen
${unterlagen}`;
  const ctl = new AbortController(); cpLaeuft = ctl;
  try {
    const { text: fertig } = await fragen([{ role: "user", content: regeln }, ...v.slice(-10)], {
      cache: false, signal: ctl.signal,
      onText: ({ text }) => { antwort.classList.remove("denkt"); antwort.innerHTML = mdZuHtml(text); box.scrollTop = box.scrollHeight; },
    });
    v.push({ role: "assistant", content: fertig });
  } catch (e) {
    const code = e && e.code;
    if (e && e.text) v.push({ role: "assistant", content: e.text });
    else v.pop();
    cpZeigen();
    if (code === "not_granted" || code === "sampling_disabled" || code === "capability_disabled" || code === "not_declared") {
      cp("fragen").hidden = true; cp("copilot").hidden = true;
    } else if (code !== "cancelled") {
      cp("cp-verlauf").insertAdjacentHTML("beforeend", `<div class="cp-fehler">${code === "rate_limited" ? "Gerade zu viele Anfragen. Versuch es gleich noch einmal." : "Das hat nicht geklappt. Versuch es noch einmal."}</div>`);
    }
  } finally {
    cpLaeuft = null; cp("cp-senden").textContent = "Senden";
    cpZeigen();
  }
}

cp("fragen").onclick = () => { const p = cp("copilot"); p.hidden = !p.hidden; if (!p.hidden) { cpKontext(); cp("cp-text").focus(); } };
cp("cp-zu").onclick = () => { cp("copilot").hidden = true; };
cp("cp-form").onsubmit = e => {
  e.preventDefault();
  if (cpLaeuft) { cpLaeuft.abort(); return; }
  const t = cp("cp-text"); const wert = t.value; t.value = ""; t.style.height = ""; cpFrage(wert);
};
cp("cp-text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); cp("cp-form").requestSubmit(); } });
cp("cp-text").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; });
function copilotBereit(fn) { fragen = fn; cp("fragen").hidden = !fn; }
if (window.claude && window.claude.use) window.claude.use("sample").then(copilotBereit).catch(() => {});

// ---------- Neue Anbieter: Karte sofort mit Claude erstellen, Hintergrundlauf prüft sie danach mit Webrecherche ----------
const domainVon = url => { try { const u = new URL(/^https?:\/\//i.test(url) ? url : "https://" + url); return /^https?:$/.test(u.protocol) && u.hostname.includes(".") ? u.hostname.replace(/^www\./, "").toLowerCase() : ""; } catch (e) { return ""; } };
const vorhanden = d => KARTEN.find(k => k.website && (domainVon(k.website) === d || domainVon(k.website).endsWith("." + d) || d.endsWith("." + domainVon(k.website))));
const STATUS = { offen: ["wartet", "Wartet auf Analyse"], arbeit: ["laeuft", "Analyse läuft"], fehler: ["fehlt", "Analyse fehlgeschlagen"] };
const fortschritt = {};                    // Abschnitt, an dem die eigene Analyse gerade schreibt
let neueKarten = [];
function anfrageZeilen() {
  if (fokus !== "Alle" || nurNah || suche) return "";
  return anfragen.filter(a => STATUS[a.status] && !vorhanden(a.domain)).map(a => {
    const [klasse, text] = STATUS[a.status];
    const extra = a.status === "fehler" && a.hinweis ? `: ${esc(a.hinweis)}` : fortschritt[a.id] ? ` · ${esc(fortschritt[a.id])}` : "";
    return `<div class="tz anfrage"><div class="name"><span class="marke-logo"><b>${esc(a.domain[0].toUpperCase())}</b></span><span>${esc(a.domain)}</span></div>
      <div class="status"><i class="${klasse}"></i>${text}${extra}${a.status === "fehler" ? `<button data-weg="${esc(a.id)}" aria-label="Entfernen" title="Entfernen"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>` : ""}</div></div>`;
  }).join("");
}

// Markdown einer Karte in dieselbe Form bringen, die build.py für die festen Karten erzeugt
function inline(t) {
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, txt, url) => `<a target="_blank" rel="noopener" href="${url.replace(/"/g, "%22")}">${txt}</a>`);
}
function mdZuKarte(md) {
  const m = md.replace(/\r/g, "").match(/^\s*---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!m) return null;
  const meta = {};
  for (const z of m[1].split("\n")) { const i = z.indexOf(":"); if (i > 0) meta[z.slice(0, i).trim()] = z.slice(i + 1).trim().replace(/^"|"$/g, ""); }
  if (!meta.name || !meta.slug) return null;
  const body = m[2].trim(), zeilen = body.split("\n");
  const PILL = lab => lab.startsWith("enneo klar") ? "p-voll" : lab.startsWith("enneo") ? "p-hell" : lab.startsWith(meta.name) && lab.includes("klar") ? "p-dunkel" : lab.startsWith(meta.name) ? "p-rand" : lab === "gleich" ? "p-grau" : "p-offen";
  const LABELS = ["enneo klar vorn", "enneo vorn", "gleich", "je nach Fall", meta.name + " klar vorn", meta.name + " vorn"];
  let html = "", i = 0;
  while (i < zeilen.length) {
    const z = zeilen[i];
    if (/^##\s+/.test(z)) { html += `<h2>${inline(z.replace(/^##\s+/, ""))}</h2>\n`; i++; }
    else if (/^\s*[-*]\s+/.test(z)) {
      html += "<ul>\n";
      while (i < zeilen.length && /^\s*[-*]\s+/.test(zeilen[i])) html += `<li>${inline(zeilen[i++].replace(/^\s*[-*]\s+/, ""))}</li>\n`;
      html += "</ul>\n";
    } else if (/^\s*\|/.test(z)) {
      const reihen = [];
      while (i < zeilen.length && /^\s*\|/.test(zeilen[i])) reihen.push(zeilen[i++].trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      const [kopf, , ...rest] = reihen;
      html += `<table>\n<thead>\n<tr>\n${kopf.map(c => `<th>${inline(c)}</th>`).join("\n")}\n</tr>\n</thead>\n<tbody>\n`;
      for (const r of rest) html += `<tr>\n${r.map((c, j) => j === r.length - 1 && LABELS.includes(c) ? `<td><span class="pill ${PILL(c)}">${esc(c)}</span></td>` : `<td>${inline(c)}</td>`).join("\n")}\n</tr>\n`;
      html += "</tbody>\n</table>\n";
    } else if (z.trim()) {
      const absatz = [];
      while (i < zeilen.length && zeilen[i].trim() && !/^(##\s|\s*[-*]\s|\s*\|)/.test(zeilen[i])) absatz.push(zeilen[i++].trim());
      html += `<p>${inline(absatz.join(" "))}</p>\n`;
    } else i++;
  }
  const folge = [...html.matchAll(/class="pill (p-[a-z]+)"/g)].map(x => x[1]);
  const eck = {};
  ((body.split("## Eckdaten")[1] || "").split("\n## ")[0]).split("\n").forEach(r => {
    const c = r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
    if (c.length >= 3 && c[0] && !c[0].startsWith("-")) eck[c[0]] = c[1].replace(/\*\*/g, "");
  });
  return { ...meta, html, folge, vorn: folge.filter(c => c === "p-voll" || c === "p-hell").length, hinten: folge.filter(c => c === "p-rand" || c === "p-dunkel").length,
    firma: eck.Firma || "", hosting: eck.Hosting || "", preis: eck.Preise || eck.Lizenz || "", quelle: md, neu: true };
}
function kartenNeuBerechnen() {
  const fest = new Set(STATISCH.map(k => k.slug));
  KARTEN = STATISCH.concat(neueKarten.filter(k => !fest.has(k.slug)));
}
const kartenText = async k => k.quelle || ladeText("karten/" + k.slug + ".md");

async function karteErstellen(id, url, domain) {
  const setze = text => { fortschritt[id] = text; if (!location.hash) uebersicht(); };
  setze("Vorbereitung");
  const [auftrag, fakten, vorbild] = await Promise.all([ladeText("auftrag-karte.md"), ladeText("enneo-fakten.md"), ladeText("karten/vier.md")]);
  const heute = new Date().toISOString().slice(0, 10);
  const prompt = `Du schreibst für den Vertrieb von enneo eine interne Battle Card über den Anbieter hinter dieser Website: ${url}

Du hast in diesem Schritt keinen Internetzugang. Schreib die Karte aus deinem eigenen Wissen über diesen Anbieter. Ein zweiter Schritt prüft sie später mit Webrecherche und ergänzt die Quellen. Deshalb gilt streng:
- Nur Aussagen, bei denen du sicher bist. Was du nicht sicher weißt, heißt „nicht bekannt“. Erfinde keine Preise, Kunden, Zahlen, Zertifikate oder Funktionen.
- Kennst du den Anbieter hinter dieser Domain nicht sicher, antworte nur mit dem Wort UNBEKANNT.
- Aussagen über enneo ausschließlich aus den enneo-Fakten unten.
- Kopf: stand "${heute}", geprueft_von "Enni", website "${url}", kategorie "Direkter Wettbewerber". Der slug ist "${domain.replace(/[^a-z0-9]+/g, "-")}".
- Unter „## Quellen“ nur die Website des Anbieters als Link.
- Antworte nur mit dem Inhalt der Markdown-Datei, beginnend mit der Zeile ---. Kein Text davor oder danach, keine Codeblöcke.

# Regeln und Format (gilt bis auf die Recherche-Teile, die übernimmt der zweite Schritt)
${auftrag}

# enneo-Fakten
${fakten}

# Vorbild-Karte für Aufbau, Ton und Tiefe
${vorbild}`;
  const ABSCHNITTE = ["Eckdaten", "Das Wichtigste vorweg", "Unsere Verkaufsargumente", "Wo", "Unterschiede auf einen Blick", "schwächer", "Fazit", "Quellen"];
  const NAMEN = ["Eckdaten", "Einordnung", "Argumente", "Stärken", "Vergleich", "Schwächen", "Fazit", "Quellen"];
  setze("Eckdaten");
  const { text } = await fragen(prompt, { cache: false, modelTier: "complex", onText: ({ text }) => {
    const h = [...text.matchAll(/^## (.+)$/gm)].map(x => x[1]).pop();
    if (h) { const j = ABSCHNITTE.findIndex(a => h.startsWith(a) || h.includes(a)); if (j >= 0 && fortschritt[id] !== NAMEN[j]) setze(NAMEN[j]); }
  } });
  const md = text.trim().replace(/^```(?:markdown)?\n?|```$/g, "").trim();
  if (/^UNBEKANNT/i.test(md)) return null;
  const karte = mdZuKarte(md);
  if (!karte || !karte.html.includes("<h2>Unterschiede auf einen Blick</h2>")) throw new Error("format");
  return { md, karte };
}

function neuMeldung(html) { const m = cp("neu-meldung"); m.innerHTML = html; m.hidden = !html; }
function neuOeffnen(auf) {
  cp("neu-feld").hidden = !auf; cp("neu-knopf").setAttribute("aria-expanded", String(auf));
  if (auf) { neuMeldung(""); cp("neu-url").focus(); }
}
async function neuBereit(user) {
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  db.collection("karten_neu").onSnapshot(s => {
    neueKarten = s.docs.map(d => mdZuKarte(String(d.data().md || ""))).filter(Boolean);
    kartenNeuBerechnen();
    if (!location.hash || neueKarten.some(k => k.slug === location.hash.slice(1))) route();
  }, () => {});
  if (user && user.can && user.can("data.write") === false) return;
  cp("neu-knopf").hidden = false;
  db.collection("anfragen").onSnapshot(s => {
    anfragen = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.erstellt || 0) - (b.erstellt || 0));
    if (!location.hash) uebersicht();
  }, () => {});
}
cp("neu-knopf").onclick = () => neuOeffnen(cp("neu-feld").hidden);
cp("neu-form").onsubmit = async e => {
  e.preventDefault();
  const eingabe = cp("neu-url").value.trim(), d = domainVon(eingabe);
  if (!d) return neuMeldung("Das sieht nicht nach einer Website aus.");
  const k = vorhanden(d);
  if (k) return neuMeldung(`${esc(k.name)} gibt es schon. <a href="#${k.slug}">Öffnen</a>`);
  const id = d.replace(/[^a-z0-9]+/g, "-"), url = /^https?:\/\//i.test(eingabe) ? eingabe : "https://" + eingabe;
  const ref = db.doc("anfragen/" + id);
  try {
    const da = await ref.get();
    if (da.exists && ["offen", "arbeit"].includes(da.data().status)) return neuMeldung("Läuft schon.");
    let von = null; try { const u = await claude.use("user"); von = u ? await u.id() : null; } catch (err) {}
    await ref.set({ url, domain: d, status: fragen ? "arbeit" : "offen", erstellt: Date.now(), gestartet: Date.now(), von });
  } catch (err) { return neuMeldung("Hat nicht geklappt. Versuch es noch einmal."); }
  cp("neu-url").value = ""; neuOeffnen(false);
  if (!fragen) return;                      // ohne Claude-Zugriff übernimmt der Hintergrundlauf
  try {
    const r = await karteErstellen(id, url, d);
    delete fortschritt[id];
    if (!r) { await ref.update({ status: "offen" }); return; }
    await db.doc("karten_neu/" + r.karte.slug).set({ md: r.md, url, domain: d, erstellt: Date.now(), von: null });
    await ref.delete();
    location.hash = r.karte.slug;
  } catch (err) {
    delete fortschritt[id];
    await ref.update({ status: "offen" }).catch(() => {});
    if (!location.hash) uebersicht();
  }
};
document.addEventListener("click", e => {
  const weg = e.target.closest("[data-weg]");
  if (weg && db) { e.preventDefault(); db.doc("anfragen/" + weg.dataset.weg).delete().catch(() => {}); return; }
  if (!cp("neu-feld").hidden && !e.target.closest("#neu-feld, #neu-knopf")) neuOeffnen(false);
});
if (window.claude && window.claude.use) window.claude.use("user").then(neuBereit, () => neuBereit(null));

window.onhashchange = route;
route();
